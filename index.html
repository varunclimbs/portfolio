<style>
/* Layout concept: a fixed painted mountain behind the page; camp cards scroll past while the climber ascends through the timeline. */
:root {
  color-scheme: dark;
  --ink: #0b141d;
  --panel: rgba(11, 20, 29, .93);
  --panel-solid: #101c28;
  --line: rgba(190, 215, 230, .2);
  --snow: #eef4f7;
  --mist: #a9bbc7;
  --hivis: #ffc72e;
  --rope: #ff7a3d;
  --glacier: #7fd0e8;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --top: 52px;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body { background: var(--ink); color: var(--snow); font: 400 16px/1.55 var(--body); overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
a { color: var(--glacier); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

/* Top bar */
.alti { position: fixed; z-index: 5; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: var(--top); padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
.alti b { font: 800 22px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.readouts { display: flex; gap: clamp(12px, 3vw, 28px); flex: none; }
.readout { display: grid; font-variant-numeric: tabular-nums; text-align: right; }
.readout span { font: 400 10px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mist); }
.readout strong { font: 800 21px/1.05 var(--display); letter-spacing: .02em; }
#roAlt { color: var(--hivis); }
.skip { flex: none; padding: 7px 11px; background: var(--hivis); color: var(--ink); border: 0; border-radius: 3px; font-weight: 700; font-size: 13px; }
.skip:hover { background: #ffe07a; }


/* Camps */
main { position: relative; z-index: 2; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.camp { min-height: 170vh; padding-block: calc(var(--top) + 6vh) 0; }
.camp:last-child { min-height: 100vh; padding-bottom: 60px; }
.card { pointer-events: auto; width: min(500px, 100%); margin-left: clamp(0px, 5vw, 88px); padding: clamp(20px, 3vw, 30px); display: grid; gap: 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.card > * { min-width: 0; }
.eyebrow { font: 500 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--glacier); font-variant-numeric: tabular-nums; }
.here { color: var(--hivis); }
h1, h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .95; letter-spacing: .01em; margin: 6px 0 0; text-wrap: balance; }
h1 { font-size: clamp(56px, 8vw, 88px); }
h2 { font-size: clamp(40px, 6vw, 60px); }
h3 { font: 600 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mist); margin: 0 0 8px; }
p { margin: 0; max-width: 62ch; }
.lede { font-size: 18px; font-weight: 500; }
.points { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 12px/1 var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; }
.ghost { background: transparent; border: 1px solid var(--glacier); color: var(--glacier); padding: 8px 12px; border-radius: 3px; font-weight: 600; }
.ghost:hover { background: var(--glacier); color: var(--ink); }
.contact { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.contact code { font: 500 15px var(--mono); user-select: all; overflow-wrap: anywhere; }
.list-links a { margin-left: 6px; font-size: 13px; }
.goals { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
a.ghost { text-decoration: none; display: inline-block; }
.dl-note { font-size: 13px; color: var(--mist); }

.routes { display: grid; gap: 6px; }
details { border: 1px solid var(--line); border-radius: 3px; }
summary { cursor: pointer; padding: 11px 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
summary span { font: 400 11px/1.8 var(--mono); color: var(--mist); text-transform: uppercase; flex: none; }
details[open] summary { border-bottom: 1px solid var(--line); }
.route-body { padding: 12px; display: grid; gap: 10px; font-size: 15px; }

/* Training wall */
.wall { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.wall-total { font-size: 15px; }
.wall-total strong { font: 900 44px/1 var(--display); color: var(--hivis); margin-right: 6px; font-variant-numeric: tabular-nums; }

.tabs button { padding: 9px 4px; background: transparent; border: 1px solid var(--line); border-radius: 3px; font-weight: 600; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--snow); color: var(--ink); border-color: var(--snow); }

.stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; }

.stat strong { font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }

.bars .track { height: 8px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.bars .fill { display: block; height: 100%; background: var(--hivis); border-radius: 2px; }

.rail { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(var(--top) + 22px); height: calc(100vh - var(--top) - 70px); max-height: 600px; width: 28px; }

.rail button { position: absolute; right: 0; transform: translateY(50%); display: flex; align-items: center; justify-content: flex-end; gap: 6px; background: none; border: 0; padding: 4px 6px; white-space: nowrap; }
.rail .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 2px solid var(--snow); flex: none; }
.rail button.passed .dot { background: var(--hivis); border-color: var(--hivis); }
.rail .label { font: 500 11px/1 var(--mono); padding: 5px 7px; background: var(--panel); border-radius: 3px; display: none; }
.rail button:hover .label, .rail button:focus-visible .label, .rail button.star .label { display: block; }
#marker { position: absolute; left: 9px; width: 10px; height: 10px; background: var(--rope); transform: translateY(50%) rotate(45deg); pointer-events: none; }

/* What the climber says at each milestone */
#bubble { position: fixed; z-index: 3; left: 0; top: 0; width: min(290px, 70vw); padding: 10px 13px; font-size: 14px; line-height: 1.4; background: var(--snow); color: var(--ink); border-radius: 4px; pointer-events: none; font-weight: 500;
  transition: opacity .25s; }
#bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: var(--snow); transform: rotate(45deg); }
#bubble .when { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #8a5a00; margin-bottom: 2px; }
#bubble .gear { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(11,20,29,.15); font-size: 13px; color: #35424d; }

#bubble.caption { left: 0; right: 0; width: auto; top: calc(var(--top) + env(safe-area-inset-top, 0px)); transform: none !important; border-radius: 0;

#bubble.caption::after { display: none; }
#bubble.fade { opacity: 0; }

  padding: calc(var(--top) + 16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sum { max-width: 720px; margin: 0 auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 4px; padding: clamp(20px, 4vw, 34px); display: grid; gap: 22px; }

#pdfPages { display: grid; gap: 12px; }

.sum h2 { font-size: clamp(40px, 7vw, 64px); }
.close { background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; font-size: 13px; }
.facts { display: grid; gap: 8px; margin: 0; }
.facts div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; }
.facts dt { font: 500 12px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--glacier); }
.facts dd { margin: 0; }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 22px; }
.sum-projects { display: grid; gap: 12px; }
.sum-projects strong { display: block; }
.sum-projects p { font-size: 14px; color: var(--mist); }

@media (max-width: 859px) {
  .alti b { font-size: 18px; }

  .card { margin-left: 0; width: 100%; }

  .rail { display: none; }

@media (max-width: 419px) {

@media (prefers-reduced-motion: reduce) {
  #bubble { transition: none; }

const K = .9, WORLD_H = 8848 * K, STEP = 4;
const slopeAt = y => .3 + 1.05 * Math.pow(Math.max(0, y) / WORLD_H, 1.4);
const table = [0];
{ let y = 0; while (y < WORLD_H) { y += slopeAt(y) * STEP; table.push(Math.min(y, WORLD_H)); } }

function pennant(wx, s, color, label, tall) {

  g.strokeStyle = "#e7edf1"; g.lineWidth = 3 * s; g.beginPath(); g.moveTo(x, by); g.lineTo(x, top); g.stroke();

function drawTool(lv, hx, hy, a) {
  g.save(); g.translate(hx, hy); g.rotate(a); g.lineCap = "round";
  if (lv <= 2) {
    g.strokeStyle = lv === 1 ? "#8a5f35" : "#b9c4cb"; g.lineWidth = lv === 1 ? 4 : 2.6;
    g.beginPath(); g.moveTo(0, -10); g.lineTo(5, 40); g.stroke();
    if (lv === 2) { g.fillStyle = "#222"; g.fillRect(-2.5, -13, 5, 10); }

    g.beginPath(); g.moveTo(0, 12);

function drawClimber(wx, wy, sx, sy, s) {

  const slope = slopeAt(wy), lean = .06 + Math.min(.26, slope * .15);
  const jacket = ["#73838e", "#73838e", "#3e8d76", "#d8503a", "#d8503a", "#f2b824"][Math.min(5, boots + (boots > 2 ? 1 : 0))];
  const pants = boots >= 4 ? "#d59c12" : boots >= 3 ? "#26303a" : "#44515c";
  const bootColor = ["#c9b9a5", "#8d8478", "#6e4a2c", "#2e2e35", "#d8503a"][boots];
  const sw = swingT > 0 ? Math.sin((1 - swingT) * Math.PI) : 0;

  g.save(); g.translate(sx, sy); g.scale(s, s); g.rotate(lean * .55); g.lineCap = "round"; g.lineJoin = "round";
  const leg = (ph, shade) => {
    const fx = Math.sin(ph) * 15, fy = -Math.max(0, Math.cos(ph)) * 8;
    g.strokeStyle = shade ? css(mix(rgb(pants), [0, 0, 0], .28)) : pants; g.lineWidth = 9;
    g.beginPath(); g.moveTo(0, -42); g.lineTo(fx * .5 + 5, -21 + fy * .5); g.lineTo(fx, -5 + fy); g.stroke();
    g.fillStyle = shade ? css(mix(rgb(bootColor), [0, 0, 0], .25)) : bootColor;
    g.beginPath(); g.roundRect(fx - 6, -7 + fy, boots >= 4 ? 20 : 17, boots >= 2 ? 9 : 6, 2); g.fill();
    if (boots >= 3) { g.fillStyle = "#d6e1e8"; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(fx - 4 + i * 5, 1 + fy); g.lineTo(fx - 2 + i * 5, 5 + fy); g.lineTo(fx + i * 5, 1 + fy); g.fill(); } }
  };

  const bx = -2 + Math.sin(walk) * 8, by = -48;
  leg(walk + Math.PI, true);
  g.strokeStyle = css(mix(rgb(jacket), [0, 0, 0], .3)); g.lineWidth = 7;
  g.beginPath(); g.moveTo(0, -64); g.lineTo(bx, by); g.stroke();

  if (packed) { g.fillStyle = packed > 8 ? "#21557a" : "#5a4632"; g.beginPath(); g.roundRect(-10 - pw, -68, pw, ph, 4); g.fill(); }
  if (rope) { g.strokeStyle = "#ff7a3d"; g.lineWidth = 3; g.beginPath(); g.ellipse(-8 - pw * .6, -72, 8 + rope, 4 + rope * .5, 0, 0, 7); g.stroke(); }

  if (rope >= 3) { g.strokeStyle = "#ffc72e"; g.lineWidth = 3; g.beginPath(); g.moveTo(-10, -44); g.lineTo(10, -44); g.stroke(); }
  if (levelOf("gps")) { g.fillStyle = "#1b2530"; g.beginPath(); g.roundRect(2, -66, 8, 12, 2); g.fill(); g.fillStyle = "#6fdc8c"; g.fillRect(3.5, -64, 5, 5); }
  /* head */

  else if (boots >= 1) { g.fillStyle = "#2e6f88"; g.beginPath(); g.arc(3, -84, 9.5, Math.PI, 0); g.fill(); }
  if (o2) { g.fillStyle = "#2f3b45"; g.beginPath(); g.roundRect(4, -82, 10, 9, 3); g.fill(); g.strokeStyle = "#2f3b45"; g.lineWidth = 2; g.beginPath(); g.moveTo(5, -74); g.quadraticCurveTo(-6, -66, -11, -72); g.stroke(); }

function draw() {
  const a = alt, wy0 = a * K, wx0 = a <= 0 ? 0 : xForY(wy0);
  const desktop = W >= 860, s = Math.max(.72, Math.min(1.1, H / 900)) * (desktop ? 1.05 : .9);
  const camX = wx0 - (desktop ? W * .7 : W * .5); camXNow = camX;
  const cy = desktop ? H * .62 : H * .56;
  const wy = surf(wx0);
  cl.sx = wx0 - camX; cl.sy = cy; cl.s = s; cl.x = wx0; cl.y = wy;
  const toS = y => cy - (y - wy);

  /* sky */
  const [top, mid, low] = ramp(SKY, a);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, css(top)); sky.addColorStop(.58, css(mid)); sky.addColorStop(1, css(low));
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  /* stars */
  const starA = smooth(5400, 8000, a);
  if (starA > 0) {
    for (let i = 0; i < 150; i++) {
      const tw = REDUCED ? 1 : .6 + .4 * Math.sin(clock * 1.5 + i);
      g.fillStyle = `rgba(255,255,255,${starA * tw * (.35 + hash(i) * .65)})`;
      g.fillRect(hash(i + 40) * W, hash(i + 80) * H * .72, 1 + (i % 9 === 0), 1 + (i % 9 === 0));
    }
  }
  /* sun rises through the climb */
  const sunY = H * (.74 - .5 * Math.min(1, a / 4500)) + H * .75 * smooth(5000, 8400, a), sunX = W * (desktop ? .36 : .25);
  if (a < 8000) {
    const sg = g.createRadialGradient(sunX, sunY, 4, sunX, sunY, 150);
    sg.addColorStop(0, "rgba(255,246,214,.95)"); sg.addColorStop(.16, "rgba(255,232,170,.55)"); sg.addColorStop(1, "rgba(255,232,170,0)");
    g.fillStyle = sg; g.fillRect(sunX - 150, sunY - 150, 300, 300);
  }
  /* the ideal, far away */
  const farA = 1 - smooth(3600, 5600, a);
  if (farA > 0) {
    const scale = (desktop ? 1 : .7) * (1 + a / 2800), px = W * (desktop ? .62 : .66), by = H * .6 + a * .02;
    const pk = 310 * scale, wd = 250 * scale;
    g.globalAlpha = farA;
    g.fillStyle = css(mix(mid, [60, 80, 115], .55));
    g.beginPath(); g.moveTo(px - wd, by); g.lineTo(px - wd * .22, by - pk * .66); g.lineTo(px, by - pk); g.lineTo(px + wd * .3, by - pk * .6); g.lineTo(px + wd, by); g.fill();
    g.fillStyle = "rgba(245,250,255,.95)";
    g.beginPath(); g.moveTo(px, by - pk); g.lineTo(px + wd * .16, by - pk * .78); g.lineTo(px + wd * .03, by - pk * .84); g.lineTo(px - wd * .06, by - pk * .74); g.lineTo(px - wd * .15, by - pk * .8); g.fill();
    if (a < 1100) {
      g.font = '500 12px "DM Mono", monospace'; g.textAlign = "center"; g.fillStyle = css([11, 20, 29], .85);
      g.fillText("the ideal, 8,848 m", px, by - pk - 10);
    }
    g.globalAlpha = 1;
  }
  /* distant ranges sink as you rise above them */
  [[.05, .5, 150, 1.2, .7], [.11, .62, 130, 4.1, .55], [.2, .76, 110, 2.6, .36]].forEach(([f, base, amp, seed, haze]) => {
    const by = H * base + wy0 * f;
    if (by - amp * 1.8 > H) return;
    g.fillStyle = css(mix(mix(ramp(BIOME, a * .65)[0], [40, 62, 96], .5), low, haze));
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, by - ridge(x + camX * (f * 2.4), seed, amp));

  });

    cloud(cx, H * (.84 + hash(i) * .13), 1.7 + hash(i + 3) * 1.4, .62 * seaA);
  }

  /* the climbable mountain */
  const face = g.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 6; i++) {
    const hereAlt = (wy + (cy - H * i / 6)) / K;
    face.addColorStop(i / 6, css(ramp(BIOME, Math.max(0, Math.min(8848, hereAlt)))[0]));
  }
  g.fillStyle = face;
  g.beginPath(); g.moveTo(-10, H + 10);
  for (let sx = -10; sx <= W + 10; sx += 7) g.lineTo(sx, toS(surf(camX + sx)));
  g.lineTo(W + 10, H + 10); g.fill();

  /* rock facets, trees, boulders on the slope */
  const c0 = Math.floor(camX / 58) - 2, c1 = Math.floor((camX + W) / 58) + 2;
  for (let i = c0; i <= c1; i++) {
    const r1 = hash(i), r2 = hash(i + .37), r3 = hash(i + .71), wx = i * 58 + r1 * 34, sf = surf(wx), ca = sf / K, x = wx - camX, y = toS(sf);
    if (ca > 2400) { g.fillStyle = `rgba(20,30,45,${ca > 6000 ? .07 : .13})`; g.beginPath(); g.moveTo(x, y + 2); g.lineTo(x + 24 + r2 * 60, y + 60 + r3 * 90); g.lineTo(x - 12 - r3 * 30, y + 80 + r2 * 150); g.fill(); }

  g.beginPath();

  g.stroke();

  camps.forEach((_, i) => campProps(i, s));

  }
  /* fixed line trails behind the climber once roped up */

    g.strokeStyle = "#ff7a3d"; g.lineWidth = 2.5; g.beginPath(); g.moveTo(cl.sx - 8 * s, cy - 44 * s);

  g.lineTo(W, H); g.fill();

  /* wind-driven snow */

    const n = Math.floor(flakes.length * snow);
    for (let i = 0; i < n; i++) {
      const f = flakes[i], sp = 120 + 340 * snow;

  const fog = .94 * Math.exp(-Math.pow((a - 8020) / 400, 2));
  if (fog > .01) { g.fillStyle = `rgba(226,235,243,${fog})`; g.fillRect(0, 0, W, H); }

  /* particles */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .16; p.life -= .022;

}


/* --- Readouts and the climber's speech --- */
let hudAlt = -1, lastSaid = null;
const LAST_DATED = monthOf(CLIMB.lastDated);
function updateHud() {
  const a = Math.round(alt);
  if (a === hudAlt) return;
  hudAlt = a;
  $("roAlt").textContent = fmt(a) + " m";
  const m = Math.round(monthOfAlt(a));
  $("roDate").textContent = m > LAST_DATED ? "Ahead" : `${MON[m % 12]} ${Math.floor(m / 12)}`;
  $("marker").style.bottom = (a / 88.48) + "%";
  document.querySelectorAll(".rail button").forEach(b => b.classList.toggle("passed", a >= camps[+b.dataset.camp].alt - 20));
}
/* The latest milestone he has passed, for the next few hundred metres */
function updateBubble() {
  const b = $("bubble");
  let said = null;
  for (const m of milestones) if (m.alt <= alt + 2) said = m;
  if (!said || alt - said.alt > 420) { b.classList.add("fade"); lastSaid = null; return; }
  if (said !== lastSaid) {
    lastSaid = said;
    const gearLine = said.gearNote ? `<span class="gear"><b>New gear:</b> ${said.gearNote}</span>` : "";
    b.innerHTML = `<span class="when">${said.when}</span>${said.text}${gearLine}`;
  }
  b.hidden = false;
  b.classList.remove("fade");
  /* Next to the climber on wide screens; a caption under the top bar when a card is in the way */
  const w = b.offsetWidth, h = b.offsetHeight;
  const x = Math.max(16, Math.min(W - w - 56, cl.sx - w / 2));
  const y = Math.max(64, cl.sy - 112 * cl.s - h);
  let blocked = W < 860;
  if (!blocked) for (const c of document.querySelectorAll(".card")) {
    const r = c.getBoundingClientRect();
    if (x < r.right && x + w > r.left && y < r.bottom && y + h > r.top) { blocked = true; break; }
  }
  b.classList.toggle("caption", blocked);
  if (!blocked) {
    b.style.transform = `translate(${x}px,${y}px)`;
    b.style.setProperty("--tail", `${Math.max(14, Math.min(w - 14, cl.sx - x))}px`);
  }
}

let prev = 0, prevGear = "";
function frame(t) {
  const dt = Math.min(.25, (t - prev) / 1000 || 0); prev = t;
  if (!REDUCED) clock += dt;
  const target = altFromScroll(), before = alt;
  alt = REDUCED ? target : alt + (target - alt) * (1 - Math.exp(-dt * 7));
  if (Math.abs(target - alt) < .4) alt = target;
  walk += (alt - before) * .055;
  gearNow = gearAt(alt);
  const key = JSON.stringify(gearNow);
  if (prevGear && key !== prevGear && alt > before) burst(cl.sx, cl.sy - 50 * cl.s, "#ffc72e", 30, 5);
  prevGear = key;
  draw();
  updateHud();
  updateBubble();
  requestAnimationFrame(frame);
}

resize();
measure();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
alt = altFromScroll();
if (location.hash === "#summary") openSummary();
requestAnimationFrame(frame);
</script>
